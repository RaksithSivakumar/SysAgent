[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sysagent"
version = "0.1.0"
description = "AI-powered system intelligence agent — powered by Google Gemini"
readme = "docs/README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
  "google-generativeai>=0.8.0",
  "psutil>=5.9.0",
  "py-cpuinfo>=9.0.0",
  "GPUtil>=1.4.0",
  "typer[all]>=0.9.0",
  "rich>=13.0.0",
  "cryptography>=42.0.0",
  "keyring>=24.0.0",
  "tomli>=2.0.0; python_version < '3.11'",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
sysagent = "sysagent.cli.__main__:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sysagent*"]
